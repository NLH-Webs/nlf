<!DOCTYPE html>

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WQXXJ7EKCJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-WQXXJ7EKCJ');
    // Touchpoints: every important link carries data-track (cta|contact|ecosystem) and data-cta.
    // Only these labels go to GA4 (existing tag), never names, emails or phone numbers.
    document.addEventListener('click', function (e) {
      // composedPath reaches links inside the contact form's shadow DOM too.
      var path = e.composedPath ? e.composedPath() : [e.target], a = null;
      for (var k = 0; k < path.length && !a; k++) { if (path[k].getAttribute && path[k].getAttribute('data-track')) a = path[k]; }
      if (!a) return;
      gtag('event', 'nlf_' + a.getAttribute('data-track'), { cta: a.getAttribute('data-cta') || '' });
    });
    window.addEventListener('nlh-lead', function () { gtag('event', 'generate_lead', { site: 'nlf' }); });
  </script>
